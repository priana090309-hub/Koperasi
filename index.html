<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk ke Koperasi Digital SMK Muthia</title>

    <link rel="stylesheet" href="yan.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <main class="auth-container">
        <section class="auth-card">

            <div class="brand">
                <img src="logo.jpeg" alt="Logo SMK Muthia" width="50">
                <span>Koperasi Digital</span>
            </div>

            <div class="auth-header">
                <h1>Selamat Datang di Koperasi Digital SMK Muthia</h1>
                <p>SMK Muthia Harapan Cicalengka.</p>
            </div>

            <div id="message" class="message"></div>

            <form id="loginForm">

                <div class="input-group">
                    <label for="loginUsername">Username atau Email</label>
                    <input
                        type="text"
                        id="loginUsername"
                        placeholder="Masukkan username atau email"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="loginPassword">Kata Sandi</label>
                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Masukkan kata sandi"
                            required
                        >
                        <button
                            type="button"
                            class="show-password"
                            onclick="togglePassword('loginPassword', this)"
                        >
                            👁
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-primary">
                    Masuk
                    <span>→</span>
                </button>

            </form>

            <div class="divider">
                <span>ATAU</span>
            </div>

            <p class="auth-footer">
                Belum memiliki akun?
                <a href="register.html">Daftar sekarang</a>
            </p>

        </section>
    </main>

    <script>
        const loginForm = document.getElementById("loginForm");
        const message = document.getElementById("message");

        loginForm.addEventListener("submit", function(e) {
            e.preventDefault();

            const inputUser = document.getElementById("loginUsername").value.trim();
            const password = document.getElementById("loginPassword").value;

            // Ambil daftar akun dari localStorage (usersList)
            const users = JSON.parse(localStorage.getItem("usersList")) || [];

            // Jika belum ada akun tersimpan sama sekali
            if (users.length === 0) {
                showMessage("Belum ada akun terdaftar. Silakan daftar terlebih dahulu.");
                return;
            }

            // Cari akun berdasarkan Username ATAU Email yang cocok dengan Password
            const userFound = users.find(user => 
                (user.username === inputUser || user.email === inputUser) && user.password === password
            );

            // Verifikasi login
            if (userFound) {
                // Simpan status login
                sessionStorage.setItem("isLoggedIn", "true");

                // Simpan username user yang login
                sessionStorage.setItem("username", userFound.username);

                showMessage("Login berhasil! Mengalihkan...");
                message.classList.add("show", "success");

                // Redirect ke halaman utama koperasi
                setTimeout(function() {
                    window.location.href = "koperasi.html";
                }, 1000);
            } else {
                showMessage("Username/Email atau kata sandi salah!");
            }
        });

        function showMessage(text) {
            message.innerText = text;
            message.classList.add("show");
        }

        function togglePassword(inputId, button) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
                button.innerText = "🙈";
            } else {
                input.type = "password";
                button.innerText = "👁";
            }
        }
    </script>
</body>
</html>
